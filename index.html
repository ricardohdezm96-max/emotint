*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:#f5f6f8;color:#1a1d23;min-height:100vh}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}

.btn:disabled{opacity:.45;cursor:default}
.opt-btn{transition:all .12s ease;-webkit-tap-highlight-color:transparent;cursor:pointer}
.opt-btn:active{transform:scale(0.95)}
.opt-btn.clicked{background:#d1fae5!important;border:2px solid #059669!important;box-shadow:0 0 0 6px rgba(5,150,105,0.25),inset 0 0 0 1px #059669;transform:scale(0.95);transition:all .08s ease}
.opt-btn.clicked .num-circle{background:#059669!important;color:#fff!important;transition:all .08s ease}
.btn-p{background:#0d7c5f;color:#fff}.btn-s{background:#fff;color:#1a1d23;border:1px solid #e2e5ea}
.btn-d{background:#fff;color:#dc2626;border:1px solid #fecaca}.btn-ds{background:#dc2626;color:#fff}
.btn-g{background:transparent;color:#5f6672;padding:6px 10px}
.inp{width:100%;padding:10px 12px;background:#fff;border:1px solid #e2e5ea;border-radius:7px;color:#1a1d23;font-size:14px;outline:none;font-family:inherit}
.inp:focus{border-color:#0d7c5f;box-shadow:0 0 0 3px #0d7c5f18}
.sel{padding:10px 12px;background:#fff;border:1px solid #e2e5ea;border-radius:7px;color:#1a1d23;font-size:14px;font-family:inherit;cursor:pointer;width:100%}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px}
.lbl{font-size:12px;color:#5f6672;font-weight:600;display:block;margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 6px;color:#9da3ae;font-weight:600;font-size:11px;text-transform:uppercase;border-bottom:2px solid #e2e5ea}
td{padding:10px 6px;border-bottom:1px solid #e2e5ea44}
.bar-bg{height:18px;background:#f0f1f3;border-radius:9px;overflow:hidden;flex:1}
.bar-fill{height:100%;border-radius:9px;display:flex;align-items:center;justify-content:flex-end;padding-right:5px;min-width:20px}
.bar-fill span{font-size:9px;color:#fff;font-weight:700}
.spin{width:22px;height:22px;border:3px solid #e2e5ea;border-top-color:#0d7c5f;border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 10px}
.tag-ie{background:#ecfdf5;color:#047857}.tag-ocean{background:#eff6ff;color:#2563eb}.tag-risk{background:#fef3c7;color:#92400e}
.tag-estilo{background:#f3e8ff;color:#7c3aed}
.tag-ie,.tag-ocean,.tag-risk,.tag-estilo{font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px}
@keyframes sp{to{transform:rotate(360deg)}}
@media print{.no-print{display:none!important} .bar-fill{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important} .card{break-inside:avoid} *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}}
@media(max-width:600px){th,td{padding:6px 3px;font-size:12px}}
</style>

const NV=[{min:1,max:1.8,n:1,t:"Muy bajo",td:"Tendencia muy baja a presentar la conducta",c:"#dc2626"},{min:1.8,max:2.6,n:2,t:"Bajo",td:"Tendencia baja a presentar la conducta",c:"#ea580c"},{min:2.6,max:3.4,n:3,t:"Medio",td:"Tendencia media a presentar la conducta",c:"#ca8a04"},{min:3.4,max:4.2,n:4,t:"Alto",td:"Tendencia alta a presentar la conducta",c:"#16a34a"},{min:4.2,max:5.01,n:5,t:"Muy alto",td:"Tendencia muy alta a presentar la conducta",c:"#047857"}];
const gN=v=>NV.find(n=>v>=n.min&&v<n.max)||NV[2];
const gid=()=>Date.now().toString(36)+Math.random().toString(36).substr(2,6);
const $=id=>document.getElementById(id);

function calcR(resp,testType){
  const test=TESTS[testType];
  const cs=test.dims.map(c=>{
    const vs=c.q.map((it,i)=>{const r=resp[c.id+'_'+i]||0;return r===0?0:(it.k===-1?6-r:r);}).filter(x=>x>0);
    if(!vs.length)return{id:c.id,nombre:c.n,icono:c.ic,promedio:0,nivel:NV[0],consistente:true,v:c.v?1:0,risk:c.risk?1:0};
    const a=Math.round((vs.reduce((a,b)=>a+b,0)/vs.length)*100)/100;
    const pm=c.risk?Math.round((6-a)*100)/100:a;
    return{id:c.id,nombre:c.n,icono:c.ic,promedio:pm,nivel:gN(pm),consistente:Math.max(...vs)-Math.min(...vs)<=3,v:c.v?1:0,risk:c.risk?1:0};
  });
  const vl=cs.filter(x=>x.promedio>0&&!x.v);const g=vl.length?Math.round((vl.reduce((a,x)=>a+x.promedio,0)/vl.length)*100)/100:0;
  const sinPuntajeUnico=(testType==='estilo');
  let allRaw=[];
  test.dims.forEach(c=>{if(c.v)return;c.q.forEach((_,i)=>{const r=resp[c.id+'_'+i]||0;if(r>0)allRaw.push(r);});});
  const acq=allRaw.length?Math.round((allRaw.reduce((a,b)=>a+b,0)/allRaw.length)*100)/100:3;
  const sesgoAquiescencia=Math.round((acq-3)*100)/100;
  const alertaAquiescencia=Math.abs(sesgoAquiescencia)>=0.75;
  let alertaHonestidad=false;
  if(testType==='riesgo'){const hi=cs.find(c=>c.id==='HI');if(hi&&hi.promedio>=4.5)alertaHonestidad=true;}
  return{competencias:cs,promedioGeneral:sinPuntajeUnico?null:g,nivelGeneral:sinPuntajeUnico?null:gN(g),todosConsistentes:cs.every(x=>x.consistente),alertaHonestidad,acquiescencia:acq,sesgoAquiescencia,alertaAquiescencia};
}

    let html=`<div style="max-width:820px;margin:0 auto;padding:20px 16px"><button class="btn btn-g no-print" onclick="backToList()" style="margin-bottom:14px">← Volver</button>`;
    html+=`<div class="card" style="padding:22px 26px;margin-bottom:12px;border-left:4px solid ${headColor}"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px"><div><div style="font-size:10px;color:#0d7c5f;text-transform:uppercase;letter-spacing:1.2px;font-weight:700">Reporte — ${t.name} <span class="${t.tagClass}" style="margin-left:6px">${t.tag}</span></div><h2 style="margin-top:4px;font-size:22px;font-weight:700">${s.nombre}</h2><p style="margin-top:2px;font-size:13px;color:#5f6672">${s.puesto} · ${s.fecha}</p></div><div style="text-align:right">${scoreBlock}<span class="badge" style="color:${s.todosConsistentes?'#16a34a':'#dc2626'};background:${s.todosConsistentes?'#16a34a':'#dc2626'}14">${s.todosConsistentes?'✓ Consistente':'⚠ Revisar'}</span></div></div></div>`;
    if(s.alertaHonestidad)html+=`<div class="card" style="padding:14px 18px;margin-bottom:12px;background:#fef2f2;border-color:#fecaca"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:20px">⚠️</span><div><div style="font-weight:700;font-size:13px;color:#dc2626">Alerta de honestidad</div><div style="font-size:12px;color:#7f1d1d;margin-top:2px">La escala de honestidad muestra puntuaciones inusualmente altas (≥4.5), lo que sugiere que el candidato pudo haber respondido de forma socialmente deseable. Interprete los demás resultados con precaución.</div></div></div></div>`;
    if(s.alertaAquiescencia)html+=`<div class="card" style="padding:14px 18px;margin-bottom:12px;background:#fffbeb;border-color:#fde68a"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:20px">📊</span><div><div style="font-weight:700;font-size:13px;color:#92400e">Posible sesgo de aquiescencia</div><div style="font-size:12px;color:#78350f;margin-top:2px">La media de respuestas crudas se desvía ${s.sesgoAquiescencia>0?'+':''}${s.sesgoAquiescencia} del punto neutral (3.0), lo que sugiere una tendencia a ${s.sesgoAquiescencia>0?'responder afirmativamente ("decir sí")':'responder negativamente ("decir no")'} con poca discriminación entre ítems. Interprete el perfil con cautela.</div></div></div></div>`;
    // Bars
    html+=`<div class="card" style="padding:18px 22px;margin-bottom:12px"><h3 style="margin-bottom:12px;font-size:14px;font-weight:700">Perfil de ${s.testType==='ocean'?'personalidad':s.testType==='riesgo'?'factores de riesgo':s.testType==='estilo'?'estilo laboral':'competencias'}</h3><div style="display:flex;flex-direction:column;gap:4px">`;
    scored.forEach(c=>{html+=`<div style="display:flex;align-items:center;gap:6px"><div style="width:20px;text-align:center;font-size:12px">${c.icono}</div><div style="width:160px;font-size:11px;color:#5f6672;font-weight:500;text-align:right;flex-shrink:0">${c.nombre}</div><div class="bar-bg"><div class="bar-fill" style="width:${(c.promedio/5)*100}%;background:linear-gradient(90deg,${c.nivel.c}aa,${c.nivel.c})"><span>${c.promedio}</span></div></div></div>`;});
    html+=`</div></div>`;
    if(s.testType==='riesgo'){const _hi=(s.competencias||[]).find(c=>c.id==='HI');if(_hi)html+=`<div style="font-size:11px;color:#5f6672;margin:-4px 0 12px;padding:8px 12px;background:#f8f9fa;border-radius:6px">🔐 Escala de validez (honestidad): <strong style="color:${_hi.promedio>=4.5?'#dc2626':'#16a34a'}">${_hi.promedio}</strong>/5 <span style="color:#9da3ae">· ≥4.5 sugiere sobre-presentación; no es un factor de riesgo en sí</span></div>`;}
    // Interpretation summary
    const allComps=s.competencias||[];
    const avgScore=s.promedioGeneral;
    const strongCount=fort.length;
    const weakCount=bajo.length;
    let interpText='';
    if(s.testType==='riesgo'){
      const bs=allComps.find(c=>c.id==='BS');
      const hi=allComps.find(c=>c.id==='HI');
      const au=allComps.find(c=>c.id==='AU');
      interpText='<strong>Interpretación general:</strong> ';
      if(avgScore>=3.5)interpText+='El perfil muestra factores protectores sólidos en la mayoría de las dimensiones. ';
      else if(avgScore>=2.6)interpText+='El perfil muestra un nivel moderado de factores de riesgo. Se recomienda evaluación complementaria. ';
      else interpText+='El perfil muestra factores de riesgo elevados en varias dimensiones. Se recomienda evaluación profesional adicional. ';
      if(bs&&bs.promedio<=2.5)interpText+='<br>⚠️ <strong>Búsqueda de sensaciones elevada</strong> — el candidato muestra alta necesidad de experiencias intensas, lo cual es un factor de riesgo. ';
      if(au&&au.promedio<=2.5)interpText+='<br>⚠️ <strong>Bajo autocontrol</strong> — dificultad para controlar impulsos, factor de riesgo importante. ';
      if(hi&&hi.promedio>=4.5)interpText+='<br>🔴 <strong>Escala de honestidad sospechosa</strong> — respuestas posiblemente manipuladas. ';
      else if(hi&&hi.promedio<=2.5)interpText+='<br>✅ <strong>Escala de honestidad normal</strong> — las respuestas parecen auténticas. ';
    } else if(s.testType==='estilo'){
      interpText='<strong>Interpretación:</strong> ';
      const tf=allComps.find(c=>c.id==='TF');
      const us2=allComps.find(c=>c.id==='US');
      const ne=allComps.find(c=>c.id==='NE');
      const pi2=allComps.find(c=>c.id==='PI');
      const rc=allComps.find(c=>c.id==='RC');
      if(tf&&tf.promedio<=2.5)interpText+='Baja tolerancia a la frustración — puede reaccionar negativamente ante obstáculos. ';
      if(us2&&us2.promedio<=2.5)interpText+='Se abruma fácilmente con múltiples tareas simultáneas. ';
      if(ne&&ne.promedio>=4)interpText+='Necesita instrucciones muy claras y estructura para funcionar bien. ';
      if(pi2&&pi2.promedio>=4)interpText+='Rinde mejor trabajando solo o en equipos muy pequeños. ';
      if(rc&&rc.promedio>=4)interpText+='Los cambios inesperados le generan ansiedad significativa. ';
      if(interpText==='<strong>Interpretación:</strong> ')interpText+='Perfil equilibrado sin necesidades de adaptación marcadas.';
    } else if(s.testType==='ocean'){
      interpText='<strong>Perfil de personalidad:</strong> ';
      allComps.forEach(c=>{
        if(c.promedio>=4)interpText+=c.nombre+' alto. ';
        else if(c.promedio<=2.5)interpText+=c.nombre+' bajo. ';
      });
      if(interpText==='<strong>Perfil de personalidad:</strong> ')interpText+='Perfil equilibrado en las cinco dimensiones.';
    } else {
      interpText='<strong>Resumen:</strong> ';
      if(strongCount>=10)interpText+='Excelente perfil de inteligencia emocional con '+strongCount+' competencias en nivel alto. ';
      else if(strongCount>=5)interpText+='Buen perfil con '+strongCount+' fortalezas identificadas. ';
      else interpText+='Perfil con áreas de oportunidad. ';
      if(weakCount>0)interpText+=weakCount+' competencia(s) requieren desarrollo. ';
    }
    html+=`<div class="card" style="padding:16px 20px;margin-bottom:12px;background:#f0f9ff;border-color:#bae6fd"><div style="font-size:13px;color:#1e3a5f;line-height:1.6">${interpText}</div></div>`;
    const sec=(title,color,items)=>{if(!items.length)return'';let s2=`<div class="card" style="padding:18px 22px;margin-bottom:12px"><h3 style="margin-bottom:10px;font-size:14px;font-weight:700;color:${color}">${title}</h3>`;items.forEach(c=>{s2+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #e2e5ea33;flex-wrap:wrap;gap:4px"><div style="flex:1;min-width:170px"><div style="display:flex;align-items:center;gap:6px"><span style="font-size:15px">${c.icono}</span><span style="font-weight:600;font-size:13px">${c.nombre}</span></div><div style="font-size:11px;color:${c.nivel.c};font-weight:500;margin-top:1px;margin-left:22px">${c.nivel.td}</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:140px"><div style="display:flex;align-items:baseline;gap:4px"><span style="font-size:24px;font-weight:800;color:${c.nivel.c}">${c.promedio}</span><span style="font-size:12px;color:#9da3ae">/ 5</span></div><div style="width:120px;height:10px;background:#f0f1f3;border-radius:5px;overflow:hidden"><div style="width:${(c.promedio/5)*100}%;height:100%;background:${c.nivel.c};border-radius:5px"></div></div><span style="font-size:12px;font-weight:600;color:${c.nivel.c}">${c.nivel.t}</span></div></div>`;});return s2+'</div>';};
    if(s.testType!=='estilo'){
    html+=sec(t.labelAlto||'💪 Fortalezas (4–5)','#059669',fort);
    html+=sec('📊 Nivel medio (3)','#ca8a04',med);
    html+=sec(t.labelBajo||'🔻 Áreas de mejora (1–2)','#dc2626',bajo);
    }else{html+=`<div class="card" style="padding:14px 18px;margin-bottom:12px;background:#faf5ff;border-color:#e9d5ff;font-size:12px;color:#6b21a8;line-height:1.6">Este test describe <strong>estilo y preferencias de trabajo</strong>, no aptitudes mejores o peores. Por eso no se resume en un puntaje único: interprete cada dimensión según su encaje con el puesto.</div>`;}
    html+=`<div class="card" style="padding:18px 22px;margin-bottom:12px"><h3 style="margin-bottom:4px;font-size:14px;font-weight:700">Validación de consistencia</h3><p style="margin-bottom:10px;font-size:11px;color:#9da3ae">Tres o más inconsistencias sugieren invalidación.</p><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:4px">`;
    (s.competencias||[]).forEach(c=>{html+=`<div style="display:flex;align-items:center;gap:5px;padding:4px 8px;border-radius:5px;background:${c.consistente?'#f0fdf4':'#fef2f2'};font-size:11px"><span>${c.consistente?'✅':'⚠️'}</span><span style="font-weight:500">${c.nombre}</span></div>`;});
    html+=`</div><div style="margin-top:10px;padding-top:10px;border-top:1px solid #e2e5ea44;font-size:11px;color:#5f6672">Índice de aquiescencia: <strong style="color:${s.alertaAquiescencia?'#dc2626':'#16a34a'}">${s.acquiescencia??'—'}</strong> <span style="color:#9da3ae">· neutral ≈ 3.0 (escala balanceada)</span></div></div><div class="card" style="padding:12px 18px;margin-bottom:14px;background:#f8f9fa;font-size:11px;color:#9da3ae;line-height:1.6"><strong style="color:#5f6672">Nota:</strong> ${t.methodology}</div>`;
    html+=`<div style="display:flex;gap:8px;justify-content:center;margin-bottom:40px" class="no-print"><button class="btn btn-p" onclick="window.print()">🖨️ Imprimir / PDF</button><button class="btn btn-s" onclick="backToList()">← Volver</button></div></div>`;
    root.innerHTML=html;return;
  }

  // ═══ CANDIDATE TEST ═══
  if(m==='test'&&state.candInfo){
    const tType=state.candInfo.testType||'emotint';const test=TESTS[tType];
    let ci=state.ci,qi=state.qi;if(ci>=test.dims.length){ci=test.dims.length-1;state.ci=ci;}const dim=test.dims[ci];if(qi>=dim.q.length){qi=dim.q.length-1;state.qi=qi;}
    const pKey=dim.id+'_'+qi,ans=Object.keys(state.resp).length;
    const totalQ=test.dims.reduce((a,d)=>a+d.q.length,0);
    const ac=tType==='ocean'?'#2563eb':tType==='riesgo'?'#92400e':'#0d7c5f';
    const abg=tType==='ocean'?'#eff6ff':tType==='riesgo'?'#fef3c7':'#ecfdf5';
    let html=`<div class="center"><div class="card" style="padding:28px 24px;max-width:580px;width:100%">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><div style="display:flex;align-items:center;gap:8px"><div style="width:28px;height:28px;border-radius:7px;background:${abg};display:flex;align-items:center;justify-content:center;font-size:14px">${test.icon}</div><span style="font-size:12px;color:#5f6672;font-weight:500">${state.candInfo.nombre}</span></div><span style="font-size:12px;color:${ac};font-weight:700">${ans} / ${totalQ}</span></div>
    <div style="width:100%;background:#e5e7eb;border-radius:10px;height:5px;margin-bottom:22px"><div style="width:${(ans/totalQ)*100}%;background:linear-gradient(90deg,${ac},${ac}88);height:100%;border-radius:10px;transition:width .3s"></div></div>
    <div style="background:${abg};border-radius:8px;padding:12px 16px;margin-bottom:20px;border-left:3px solid ${ac}"><div style="display:flex;align-items:center;gap:6px"><span style="font-size:16px">${test.icon}</span><div><div style="font-size:10px;color:${ac};text-transform:uppercase;letter-spacing:.8px;font-weight:700">Evaluación en curso</div><div style="font-size:16px;font-weight:700;margin-top:1px">${test.name}</div></div></div><div style="font-size:12px;color:#5f6672;margin-top:4px;margin-left:24px">${test.desc}</div></div>
    <div><div style="font-size:11px;color:#9da3ae;margin-bottom:6px;font-weight:600">Pregunta ${qi+1} de ${dim.q.length}</div><p style="font-size:15px;line-height:1.65;margin-bottom:20px;font-weight:500">${dim.q[qi].t}</p><div style="display:flex;flex-direction:column;gap:7px">`;
    test.likert.forEach(o=>{const sel=state.resp[pKey]===o.v;html+=`<button class="btn opt-btn" onclick="clickAnswer(this,${o.v})" style="display:flex;align-items:center;gap:12px;padding:10px 14px;border:${sel?'2px solid '+ac:'1px solid #e2e5ea'};border-radius:9px;background:${sel?abg:'#fff'};font-size:13px;text-align:left;width:100%"><div class="num-circle" style="width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:${sel?ac:'#f3f4f6'};color:${sel?'#fff':'#9da3ae'};font-weight:700;font-size:12px;flex-shrink:0;transition:all .12s ease">${o.v}</div><span style="font-weight:${sel?600:400}">${o.t}</span></button>`;});
    html+=`</div></div>`;
    if(ci>0||qi>0)html+=`<button class="btn btn-g" onclick="prevQ()" style="margin-top:12px;font-size:12px">← Anterior</button>`;
    html+=`</div></div>`;root.innerHTML=html;return;
  }

  if(m==='done'){root.innerHTML=`<div class="center"><div class="card" style="padding:52px 40px;max-width:480px;width:100%;text-align:center"><div style="width:72px;height:72px;border-radius:50%;background:#ecfdf5;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:30px;border:2px solid #a7f3d0">✓</div><h1 style="font-size:22px;color:#065f46;margin-bottom:8px;font-weight:700">¡Evaluación completada!</h1><p style="color:#5f6672;font-size:14px;line-height:1.6;margin-bottom:6px">Gracias por completar la evaluación.</p><p style="color:#9da3ae;font-size:13px;line-height:1.5">Tus respuestas han sido registradas. El equipo de RH revisará tus resultados y se pondrá en contacto contigo.</p><div style="margin-top:24px;padding:12px 18px;background:#f0fdf4;border-radius:8px;border:1px solid #d1fae5"><p style="font-size:12px;color:#065f46;font-weight:500">Ya puedes cerrar esta ventana.</p></div></div></div>`;return;}
}

// ─── ACTIONS ────────────────────────────────────────────
async function doSetup(pin){await fbS('config/pin',pin);state.mode='admin';await refresh();}
window.doLogin=async(pin)=>{const p=await fbG('config/pin');if(pin===p){state.mode='admin';await refresh();}else $('perr').style.display='block';};
window.showNew=()=>{$('newForm').style.display='block';$('newForm').innerHTML=`<div class="card" style="padding:24px;margin-bottom:20px;border-color:#a7f3d0"><h3 style="margin-bottom:16px;font-size:15px;font-weight:600">Nueva evaluación</h3><div style="display:flex;gap:12px;flex-wrap:wrap"><div style="flex:1;min-width:180px"><label class="lbl">Nombre</label><input id="cN" class="inp" placeholder="Ej: Luis Rivas"></div><div style="flex:1;min-width:180px"><label class="lbl">Puesto</label><input id="cP" class="inp" placeholder="Ej: Gerente de Operaciones"></div><div style="flex:1;min-width:220px"><label class="lbl">Tipo de prueba</label><select id="cT" class="sel"><option value="emotint">🧠 Emotint — Inteligencia Emocional (70 preg.)</option><option value="ocean">🔬 OCEAN — Personalidad Big Five (50 preg.)</option><option value="riesgo">🔎 Factores de Riesgo Psicosocial (49 preg.)</option><option value="estilo">🧩 Perfil Estilo Laboral (48 preg.)</option></select></div></div><div style="display:flex;gap:10px;margin-top:16px"><button class="btn btn-p" onclick="createLink()">Generar enlace</button><button class="btn btn-s" onclick="$('newForm').style.display='none'">Cancelar</button></div></div>`;};
window.createLink=async()=>{const n=$('cN').value.trim(),p=$('cP').value.trim(),t=$('cT').value;if(!n||!p)return;const id=gid();await fbS('pendientes/'+id,{nombre:n,puesto:p,testType:t,creado:new Date().toISOString()});await refresh();};
window.copyLink=(id)=>{const u=location.origin+location.pathname+'#eval-'+id;navigator.clipboard.writeText(u).catch(()=>{});alert('✅ Enlace copiado:\n'+u);};
window.delPend=async(id)=>{await fbD('pendientes/'+id);await refresh();};
window.confirmDel=(id)=>{const b=$('del-'+id);if(b)b.outerHTML=`<button class="btn btn-ds" style="padding:5px 10px;font-size:11px" onclick="doDelEval('${id}')">Confirmar</button><button class="btn btn-s" style="padding:5px 8px;font-size:11px;margin-left:4px" onclick="doRefresh()">No</button>`;};
window.doDelEval=async(id)=>{await fbD('evaluaciones/'+id);state.selId=null;await refresh();};
window.viewDetail=(id)=>{state.selId=id;render();};
window.backToList=()=>{state.selId=null;render();};
window.doRefresh=async()=>await refresh();

window.clickAnswer=(btn,val)=>{document.querySelectorAll('.opt-btn').forEach(b=>b.classList.remove('clicked'));btn.classList.add('clicked');setTimeout(()=>answer(val),80);};
window.answer=(val)=>{if(state._processing)return;state._processing=true;const tType=state.candInfo.testType||'emotint';const test=TESTS[tType];const dim=test.dims[state.ci];const key=dim.id+'_'+state.qi;state.resp[key]=val;try{localStorage.setItem('emotint-progress-'+state.candInfo.evalId,JSON.stringify({resp:state.resp}));}catch(e){}setTimeout(()=>{const pos=getNextPos(test,state.resp);if(pos){state.ci=pos.ci;state.qi=pos.qi;state._processing=false;render();}else{doFinalize();}},80);};
function getNextPos(test,resp){for(let c=0;c<test.dims.length;c++){for(let q=0;q<test.dims[c].q.length;q++){if(!resp[test.dims[c].id+'_'+q])return{ci:c,qi:q};}}return null;}
window.prevQ=()=>{const tType=state.candInfo.testType||'emotint';const test=TESTS[tType];let found=false;for(let c=state.ci;c>=0&&!found;c--){const startQ=(c===state.ci)?state.qi-1:test.dims[c].q.length-1;for(let q=startQ;q>=0;q--){state.ci=c;state.qi=q;found=true;break;}}render();};

async function doFinalize(){if(finalized)return;finalized=true;try{localStorage.removeItem('emotint-progress-'+state.candInfo.evalId);}catch(e){}const tType=state.candInfo.testType||'emotint';const res=calcR(state.resp,tType);await fbS('evaluaciones/'+state.candInfo.evalId,{nombre:state.candInfo.nombre,puesto:state.candInfo.puesto,testType:tType,fecha:new Date().toISOString().replace('T',' ').slice(0,19),...res});await fbD('pendientes/'+state.candInfo.evalId);state.mode='done';render();}

init();
</script>
</body>
</html>
